[package]
name = "haas-escrow"
version = "0.1.0"
description = "HAAS booking escrow: one PDA per booking holding SPL USDC until the HAAS arbiter releases it to the worker, or the deadline passes and anyone can refund the hirer."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "haas_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["associated_token", "token", "token_2022"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Standalone workspace: this crate is the only member.
[workspace]
