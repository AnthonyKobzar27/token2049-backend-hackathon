# Masumi Payment Service 0.29.0 + Postgres, Preprod, tuned for a demo. Not for mainnet.
# Image: ghcr.io/masumi-network/masumi-payment-service:0.29.0 (tag exists in the registry).
# Env names are from the service's .env.example at tag 0.29.0.
name: haas-masumi

services:
  payment-service:
    image: ghcr.io/masumi-network/masumi-payment-service:0.29.0
    container_name: haas-masumi-payment
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/masumi_payment?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32+ chars) in .env}
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY (32+ chars) in .env}
      BLOCKFROST_API_KEY_PREPROD: ${BLOCKFROST_API_KEY_PREPROD:?set BLOCKFROST_API_KEY_PREPROD in .env}
      SEED_ONLY_IF_EMPTY: 'true'
      SEED_LOG: ${SEED_LOG:-0}
      # Blank: the seed generates new wallets once (stored encrypted with ENCRYPTION_KEY; see README).
      PURCHASE_WALLET_PREPROD_MNEMONIC: ${PURCHASE_WALLET_PREPROD_MNEMONIC:-}
      SELLING_WALLET_PREPROD_MNEMONIC: ${SELLING_WALLET_PREPROD_MNEMONIC:-}
      COLLECTION_WALLET_PREPROD_ADDRESS: ${COLLECTION_WALLET_PREPROD_ADDRESS:-}
      # COLLECTION_WALLET_V2_PREPROD_ADDRESS is deliberately not set: an empty string is not the same as unset, and
      # a "" collection address sends the seller's payout to an odd place. Unset keeps it null (payout to the seller).
      # The guide requires this: after unlockTime the service withdraws the escrow to the seller by itself.
      AUTO_WITHDRAW_PAYMENTS: 'true'
      # Demo tuning. Defaults are 3-5 minutes and 20 confirmations.
      BLOCK_CONFIRMATIONS_THRESHOLD: '1'
      BATCH_PAYMENT_INTERVAL: '15'
      CHECK_TX_INTERVAL: '15'
      CHECK_SUBMIT_RESULT_INTERVAL: '15'
      CHECK_COLLECTION_INTERVAL: '30'
      CHECK_COLLECT_REFUND_INTERVAL: '30'
      CHECK_SET_REFUND_INTERVAL: '30'
      CHECK_UNSET_REFUND_INTERVAL: '30'
      CHECK_AUTHORIZE_REFUND_INTERVAL: '30'
      REGISTER_AGENT_INTERVAL: '30'
      AUTO_DECISION_INTERVAL: '15'
    # The seed can print wallet mnemonics; its output is discarded so they never reach the logs. Read the public
    # addresses in the admin UI. SEED_LOG=1 keeps the output, for a throwaway laptop setup only.
    command: sh -c "pnpm run prisma:migrate && if [ \"$${SEED_LOG:-0}\" = 1 ]; then pnpm run prisma:seed; else pnpm run prisma:seed >/dev/null 2>&1; fi && pnpm run start"
    healthcheck:
      # node:20-slim has no curl
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: haas-masumi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: masumi_payment
    volumes:
      - masumi_payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d masumi_payment']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  masumi_payment_pgdata:
